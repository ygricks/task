info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{HOST}}/auth/login"
  headers:
    - name: "{{CSRF}}"
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const HOST = bru.getEnvVar("HOST");

        const jar = bru.cookies.jar();
        const xsrf = await jar.getCookie(HOST, "XSRF-TOKEN");

        const status = res.getStatus();

        if(status == 200 && xsrf) {
          bru.setVar("csrfToken", xsrf.value);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
