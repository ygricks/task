info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{HOST}}/auth/login"
  headers:
    - name: x-csrf-token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("csrfToken", data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
