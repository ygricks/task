info:
  name: csrf
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}/auth/csrf-token"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const HOST = bru.getEnvVar("HOST");

        const jar = bru.cookies.jar();
        const xsrf = await jar.getCookie(HOST, "XSRF-TOKEN");

        const status = res.getStatus();

        if(status == 200 && xsrf) {
          bru.setVar("csrfToken", xsrf.value);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
