info:
  name: POST_create
  type: http
  seq: 2

http:
  method: POST
  url: "{{HOST}}/task"
  headers:
    - name: "{{CSRF}}"
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "name": "test",
        "description": "test bruno post req"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return task nr.1", function () {
          expect(res.getStatus()).to.equal(201);
          const body = res.getBody();
          expect(body).to.have.property("id");
          const status = res.getStatus();
          if(status == 201) {
            bru.setVar("TASK_ID", body.id);
          }
          expect(body.name).to.equal("test");
          expect(body.description).to.equal("test bruno post req");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
