info:
  name: csrf
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}/auth/csrf-token"
  headers:
    - name: x-csrf-token
      value: "{{csrfToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("csrfToken", data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
